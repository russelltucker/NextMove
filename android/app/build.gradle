plugins { id 'com.android.application' }

android {
    namespace 'com.nextmove.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.russelltucker.nextmove'
        minSdk 26
        targetSdk 36
        versionCode 6
        versionName '2.0.5'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('NEXTMOVE_KEYSTORE_PATH') ?: 'nextmove-release.jks')
            storePassword System.getenv('NEXTMOVE_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('NEXTMOVE_KEY_ALIAS') ?: ''
            keyPassword System.getenv('NEXTMOVE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
