name: Build NextMove Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'icons/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore NextMove v2 signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nextmove-v2-debug-signing-20260818

      - name: Create v2 signing key on first build
        if: steps.signing-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=NextMove v2,O=NextMove,C=US'

      - name: Copy current web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html app.js styles.css manifest.webmanifest android/app/src/main/assets/
          cp icons/nextmove-icon.svg android/app/src/main/assets/icons/nextmove-icon.svg

      - name: Build NextMove v2.0.1 APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NextMove_v2.0.1_Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextMove-v2.0.1-Android16
          path: NextMove_v2.0.1_Android16.apk
          retention-days: 90
