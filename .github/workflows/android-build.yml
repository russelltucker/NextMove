name: Build NextMove Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'icons/**'
      - 'index.html'
      - 'app.js'
      - 'dashboard-nav.js'
      - 'styles.css'
      - 'header-sync.css'
      - 'sync-button.js'
      - 'notification-permission.js'
      - 'manifest.webmanifest'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore permanent signing keystore
        env:
          NEXTMOVE_KEYSTORE_BASE64: ${{ secrets.NEXTMOVE_KEYSTORE_BASE64 }}
        run: |
          test -n "$NEXTMOVE_KEYSTORE_BASE64" || { echo 'Missing NEXTMOVE_KEYSTORE_BASE64 secret'; exit 1; }
          printf '%s' "$NEXTMOVE_KEYSTORE_BASE64" | base64 --decode > android/app/nextmove-release.jks

      - name: Copy current web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/icons
          cp index.html app.js dashboard-nav.js styles.css header-sync.css sync-button.js notification-permission.js manifest.webmanifest android/app/src/main/assets/
          cp icons/nextmove-icon.svg icons/sync-icon.svg android/app/src/main/assets/icons/

      - name: Build signed NextMove v2.0.10-test APK
        working-directory: android
        env:
          NEXTMOVE_KEYSTORE_PATH: nextmove-release.jks
          NEXTMOVE_KEYSTORE_PASSWORD: ${{ secrets.NEXTMOVE_KEYSTORE_PASSWORD }}
          NEXTMOVE_KEY_ALIAS: ${{ secrets.NEXTMOVE_KEY_ALIAS }}
          NEXTMOVE_KEY_PASSWORD: ${{ secrets.NEXTMOVE_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk NextMove_v2.0.10-test_Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextMove-v2.0.10-test-Android16
          path: NextMove_v2.0.10-test_Android16.apk
          retention-days: 90
