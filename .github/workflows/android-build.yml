name: Build NextMove Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - 'manifest.webmanifest'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore fixed NextMove signing key
        run: |
          base64 -d android/signing/nextmove-release.keystore.b64 > android/signing/nextmove-release.keystore
          keytool -list -keystore android/signing/nextmove-release.keystore -storepass nextmove2026 -alias nextmove >/dev/null

      - name: Copy current web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res/drawable
          cp index.html app.js styles.css manifest.webmanifest android/app/src/main/assets/
          python3 - <<'PY'
          from pathlib import Path
          import re, base64
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'data:image/png;base64,([^\"\']+)', html)
          if not m:
              raise SystemExit('Embedded NextMove PNG logo not found in index.html')
          Path('android/app/src/main/res/drawable/nextmove_logo.png').write_bytes(base64.b64decode(m.group(1)))
          PY

      - name: Build Android 16 APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk NextMove_v1.8.2_BackgroundSync_Android16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NextMove-v1.8.2-Android16
          path: NextMove_v1.8.2_BackgroundSync_Android16.apk
          retention-days: 90
